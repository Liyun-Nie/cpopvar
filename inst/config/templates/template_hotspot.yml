# =================================================================
# cpopvar - Hotspot Analysis Template
# =================================================================
# This template focuses specifically on variant hotspot identification
# and enrichment analysis (M03 module only) for specialized analyses.

execution_mode: "full_analysis"

session_info:
  session_id: "hotspot_analysis_template"
  run_name: "Hotspot Analysis"
  description: "Variant hotspot identification and enrichment analysis"

workflow:
  region_data_mode: "precomputed"
  description: "Hotspot analysis workflow focusing on variant clustering and enrichment"

input_files:
  main_data: "data/input/main_data.csv"
  cds_lengths: "data/input/cds_lengths.csv"
  group_info: "data/input/group_info.csv"
  region_info: "data/input/region_info.csv"

column_mappings:
  main_data:
    sample_id: "V1"
    species: "V2"
    position: "V3"
    var_type: "V4"
    gene: "V14"
    region_type: "V8"
  cds_lengths:
    gene: "gene"
    length: "length"
  region_info:
    species: "species"
    region_name: "Region_Name"
    region_type: "Region_Type"
    start_pos: "Start"
    end_pos: "End"

analysis_tasks:
  core_preprocessing:
    enabled: true
    description: "Essential data preprocessing and validation"
    
  core_filtering:
    enabled: true
    description: "Variant filtering based on frequency thresholds"
    parameters:
      frequency_threshold: 0.05
      
  core_normalization:
    enabled: true
    description: "Frequency normalization and RNA category aggregation"
    
  M01_data_distribution:
    enabled: false
    description: "Data distribution visualization (disabled in hotspot template)"
      
  M02_comparative_analysis:
    enabled: false
    description: "Comparative analysis (disabled in hotspot template)"
      
  M03_hotspot_analysis:
    enabled: true
    description: "Variant hotspot identification and enrichment analysis"
    parameters:
      data_scoping:
        target_species: ["all"]
        target_var_types: ["snp", "INDEL", "complex", "mnp"]
        target_region_types: ["CDS", "IGS", "intron", "RNA"]
      hotspot_threshold: 0.75
      enrichment_analysis: true
      pca_analysis: true
      correlation_analysis: true

visual_settings:
  theme: "publication"
  color_scheme: "plasma"
  figure_resolution: 300
  figure_format: ["png", "pdf"]

output_settings:
  generate_report: true
  save_intermediate: true
  debug_mode: false