# =================================================================
# cpopvar - Complete Analysis Template
# =================================================================
# This template provides a comprehensive analysis configuration
# enabling all analysis modules (M01 + M02 + M03) for complete
# chloroplast genome variant analysis.

execution_mode: "full_analysis"

session_info:
  session_id: "full_analysis_template"
  run_name: "Complete Analysis"
  description: "Comprehensive chloroplast genome variant analysis with all modules enabled"

workflow:
  region_data_mode: "precomputed"
  description: "Complete analysis workflow with all visualization modules"

input_files:
  main_data: "data/input/main_data.csv"
  cds_lengths: "data/input/cds_lengths.csv"
  group_info: "data/input/group_info.csv"
  region_info: "data/input/region_info.csv"

column_mappings:
  main_data:
    sample_id: "V1"
    species: "V2"
    position: "V3"
    var_type: "V4"
    gene: "V14"
    region_type: "V8"
  cds_lengths:
    gene: "gene"
    length: "length"
  region_info:
    species: "species"
    region_name: "Region_Name"
    region_type: "Region_Type"
    start_pos: "Start"
    end_pos: "End"

analysis_tasks:
  core_preprocessing:
    enabled: true
    description: "Essential data preprocessing and validation"
    
  core_filtering:
    enabled: true
    description: "Variant filtering based on frequency thresholds"
    parameters:
      frequency_threshold: 0.1
      
  core_normalization:
    enabled: true
    description: "Frequency normalization and RNA category aggregation"
    
  M01_data_distribution:
    enabled: true
    description: "Data distribution visualization and statistics"
    parameters:
      data_scoping:
        target_species: ["all"]
        target_var_types: ["snp", "INDEL", "complex", "mnp"]
        target_region_types: ["CDS", "IGS", "intron", "RNA"]
      plot_types: ["density", "boxplot", "histogram", "pie_matrix"]
      
  M02_comparative_analysis:
    enabled: true
    description: "Inter-group and inter-species comparative analysis"
    parameters:
      data_scoping:
        target_species: ["all"]
        target_var_types: ["snp", "INDEL", "complex", "mnp"]
        target_region_types: ["CDS", "IGS", "intron", "RNA"]
      analysis_types: ["region_type", "var_type", "external_factors"]
      statistical_tests: true
      
  M03_hotspot_analysis:
    enabled: true
    description: "Variant hotspot identification and enrichment analysis"
    parameters:
      data_scoping:
        target_species: ["all"]
        target_var_types: ["snp", "INDEL", "complex", "mnp"]
        target_region_types: ["CDS", "IGS", "intron", "RNA"]
      hotspot_threshold: 0.75
      enrichment_analysis: true
      pca_analysis: true

visual_settings:
  theme: "publication"
  color_scheme: "viridis"
  figure_resolution: 300
  figure_format: ["png", "pdf"]

output_settings:
  generate_report: true
  save_intermediate: true
  debug_mode: false