name: R package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }

    env:
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: ${{ runner.os != 'macOS' }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: runner.os != 'macOS'
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: "2"
      # pak cannot extract multiple CRAN macOS arm64 binaries
      # (ca_0.72.tgz, knitr_1.52.tgz: unknown archive type).
      # remotes uses R's untar instead of pak's libarchive.
      - name: Install macOS dependencies without pak
        if: runner.os == 'macOS'
        run: |
          options(Ncpus = 2, repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("BiocManager", "remotes", "rcmdcheck"), type = "binary")
          options(repos = BiocManager::repositories())
          remotes::install_deps(dependencies = TRUE, type = "binary", upgrade = "never")
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
